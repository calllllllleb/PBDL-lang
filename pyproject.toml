[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pbdl-lang"
version = "1.0.0"
description = "Python runtime support for the PBDL 1.0 document language."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.18",
]

[project.urls]
Repository = "https://github.com/calllllllleb/PBDL-lang"

[project.optional-dependencies]
test = [
    "pytest>=8",
]
build = [
    "build>=1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pbdl"]

[tool.hatch.build.targets.wheel.force-include]
"spec/schema/pbdl-v1.schema.json" = "pbdl/_data/pbdl-v1.schema.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
