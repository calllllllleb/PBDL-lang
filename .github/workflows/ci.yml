name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run test suite
        run: python -m pytest -q

  distribution:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and build dependencies
        run: python -m pip install ".[build]"

      - name: Build wheel and sdist
        run: python -m build

      - name: Verify distribution contents
        run: |
          python - <<'PY'
          from email.parser import Parser
          from pathlib import Path
          import tarfile
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          sdists = list(Path("dist").glob("*.tar.gz"))
          assert len(wheels) == 1, wheels
          assert len(sdists) == 1, sdists

          required_runtime_files = {
              "pbdl/__init__.py",
              "pbdl/canonicalization.py",
              "pbdl/equality.py",
              "pbdl/relation_vocabulary.py",
              "pbdl/resolution.py",
              "pbdl/schema_validation.py",
              "pbdl/semantic_validation.py",
              "pbdl/_data/pbdl-v1.schema.json",
          }

          repository_license = Path("LICENSE").read_bytes()

          with ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
              assert required_runtime_files <= names
              packaged_schema = archive.read("pbdl/_data/pbdl-v1.schema.json")

              metadata_names = [
                  name for name in names
                  if name.endswith(".dist-info/METADATA")
              ]
              license_names = [
                  name for name in names
                  if name.endswith(".dist-info/licenses/LICENSE")
              ]
              assert len(metadata_names) == 1, metadata_names
              assert len(license_names) == 1, license_names

              metadata = Parser().parsestr(
                  archive.read(metadata_names[0]).decode("utf-8")
              )
              assert metadata["Name"] == "pbdl-lang"
              assert metadata["Version"] == "1.0.0"
              assert metadata["License-Expression"] == "Apache-2.0"
              assert archive.read(license_names[0]) == repository_license

          with tarfile.open(sdists[0], "r:gz") as archive:
              license_members = [
                  member
                  for member in archive.getmembers()
                  if member.isfile() and member.name.endswith("/LICENSE")
              ]
              assert len(license_members) == 1, license_members
              extracted = archive.extractfile(license_members[0])
              assert extracted is not None
              assert extracted.read() == repository_license

          canonical_schema = Path("spec/schema/pbdl-v1.schema.json").read_bytes()
          assert packaged_schema == canonical_schema
          assert not any(
              name.startswith(("spec/", "tests/", "docs/"))
              for name in names
          )
          PY

      - name: Install wheel into clean environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/pbdl-wheel-smoke"
          "$RUNNER_TEMP/pbdl-wheel-smoke/bin/python" -m pip install dist/*.whl

      - name: Smoke test installed wheel outside repository
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          unset PYTHONPATH
          "$RUNNER_TEMP/pbdl-wheel-smoke/bin/python" - <<'PY'
          from pathlib import Path
          import sys

          import pbdl
          from pbdl import (
              RelationVocabulary,
              canonicalize_document,
              documents_canonically_equal,
              is_canonical_normal_form,
              resolve_references,
              validate_document,
              validate_relation_vocabulary,
              validate_semantics,
          )

          module_path = Path(pbdl.__file__).resolve()
          assert module_path.is_relative_to(Path(sys.prefix).resolve()), module_path

          valid_document = {
              "pbdl_version": "1.0",
              "subjects": [{"id": "subject_1"}],
              "behaviors": [],
              "preferences": [],
              "relations": [],
          }
          invalid_document = {
              "subjects": [{"id": "subject_1"}],
              "behaviors": [],
              "preferences": [],
              "relations": [],
          }

          assert validate_document(valid_document).valid
          assert not validate_document(invalid_document).valid
          print(module_path)
          PY
